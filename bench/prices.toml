# ---------------------------------------------------------------------------------------------------------
# Managed sandboxes and hosted runners, USD.
#
# model = "resource":   cost = vCPU x cpu rate + GiB x ram rate (+ disk), for the time billed.
#                       cpu_billing = "active" means the CPU rate applies to --cpu-util x the time.
#                       With [[vendor.size]] entries, a request is rounded up to the smallest size that
#                       fits and billed on that size's resources.
# model = "mcu":        cost = max(vCPU / vcpu_per_mcu, GiB / gib_per_mcu) x MCU rate x time.
# model = "fixed_rate": [[vendor.size]] entries carry a price per hour or per minute for the whole machine.
# granularity:          "second" = exact, "minute" = each machine rounded up to a whole minute.
# [[vendor.plan]]:      cost.py picks the first plan whose limits fit the request. Fees are monthly and are
#                       shown beside the run cost, never hidden inside it.
# ---------------------------------------------------------------------------------------------------------

