# List prices used by bench/cost.py. Read from the vendors' public pages on 2026-11-14.
#
# Rules for this file:
# - A number appears here only if it was read from a vendor page. Arithmetic is done by cost.py, not here.
# - rates keep the vendor's own unit (for example "vcpu-second" or "core-second"); cost.py converts them.
# - verified = false means at least one input the calculator uses is unconfirmed. The reason is in
#   unverified_items. cost.py marks such rows with * and prints the reasons under the table.
# - A list price is not a measured price. Discounts, credits, committed use and taxes are not applied.

[meta]
read_date = "2026-11-14"
# The one place the exchange rate lives. It is an ASSUMPTION, not a market rate: it is the rate that
# Hetzner's own block-storage page implies (EUR 0.044 shown next to USD 0.0484). Change it here to rerun.
fx_usd_per_eur = 1.10
fx_note = "Assumption: the rate implied by Hetzner's own block-storage page (EUR 0.044 next to USD 0.0484). Not a market rate."
# Units: GB and GiB are treated as the same unit, as the vendors' pages do not separate them.

# ---------------------------------------------------------------------------------------------------------
# Hetzner Cloud, EUR, excluding VAT.
# ---------------------------------------------------------------------------------------------------------
[hetzner]
currency = "EUR"
billing = "started_hour"            # every started hour is billed in full, until the server is deleted
monthly_cap = true                  # the bill for one server never exceeds its monthly price
hours_per_month = 730               # used only to apply the monthly cap to long runs
includes_ipv4 = true                # prices on hetzner.com include a primary IPv4 address
ipv4_eur_per_month = 0.50           # an IPv6-only server costs this much less per month
ipv4_source = "https://docs.hetzner.com/cloud/servers/overview/"
billing_source = "https://docs.hetzner.com/cloud/billing/faq/"
billing_quote = "Hourly usage is rounded up to the full hour"
read_date = "2026-11-14"
# The pages show one "from" hourly price per type. The research note assumed it is the HEL1 price and did
# not confirm that. Cross-check (see tests/bench): hourly x 624 is within rounding of the HEL1 monthly price
# for all 13 types. Hourly prices for NBG1 are not published on the pages; cost.py estimates them by scaling
# with the NBG1/HEL1 monthly ratio, and marks them "est.".
hourly_price_location = "hel1"
hourly_price_location_verified = false
nbg1_hourly_is_estimate = true
price_change_note = "Hetzner raised prices on 15 June 2026 (CPX and CCX by about +144% to +176%). The date comes from a search-engine summary of Hetzner's price-adjustment page, which could not be fetched. Treat as unverified. Any comparison made before that date is stale."
price_change_verified = false
product_pages = [
  "https://www.hetzner.com/cloud/cost-optimized",
  "https://www.hetzner.com/cloud/regular-performance",
  "https://www.hetzner.com/cloud/general-purpose",
]

[hetzner.extras]
# Not used by the calculator. Kept so the list matches the research note.
volume_eur_per_gb_month = 0.044
volume_source = "https://www.hetzner.com/cloud/block-storage/"
volume_verified = true
snapshot_eur_per_gb_month = 0.0143
snapshot_verified = false
snapshot_note = "The page label is ambiguous. Read as per GB per month."
included_traffic_eu_tb = 20
traffic_overage_eur_per_tb = 1.00

